# The chat model on a Strata server (DeepSeek-V4.1-Flash on Strata's strata-dsv41 engine) instead of the
# Nemotron vLLM. The embeddings stay local. Enable in .env, with the server from compose/strata.yml:
#   COMPOSE_FILE=docker-compose.yml:compose/strata.yml:compose/strata-llm.yml
#   LLM_BASE_URL=http://strata:8095/v1/
#   LLM_MODEL_ID=deepseek-v4.1-flash
#   LLM_VISION=off            # the DeepSeek pack reads no pictures
#   OPENCLAW_ACTIVE_MEMORY=off
# compose/strata.yml gives the server VLLM_API_KEY as a second key: config-init sends that key to the chat
# and the embedding endpoint. A Strata server elsewhere: point LLM_BASE_URL at it and add VLLM_API_KEY to
# its STRATA_API_KEY list (comma-separated).
#
# It serves one request at a time: Discord turns, claim-guard checks and a Claude Code session on the same
# server wait for each other. Active Memory's 30 s recall timed out behind that on every turn, so it is off.
# MESHCORE_AGENT_TIMEOUT_S=3600 for the MeshCore bridge: its 180 s default does not cover a turn that waits
# behind a Discord turn and then thinks.
# The 30-min limits were sized for Nemotron. DeepSeek thinks at ~17 tok/s and up to 24K tokens per call, so a
# three-call agent turn (a triple-pendulum animation checked by simulation) hit OPENCLAW_AGENT_TIMEOUT_SECONDS
# in its third call. For autonomous work that may run for days:
#   OPENCLAW_AGENT_TIMEOUT_SECONDS=604800   a run, 7 days (the schema takes a positive integer)
#   LLM_REQUEST_TIMEOUT_SECONDS=86400       the stream-idle watchdog of one model call: a call queued behind
#                                           another client's long call gets no event until its turn comes
#   OPENCLAW_SUBAGENTS_RUN_TIMEOUT=0        a sub-agent, no limit
#   OPENCLAW_EXEC_TIMEOUT_SEC=86400         one shell command (builds, training)
# The engine still serves one call at a time; other clients' calls queue between a long run's calls.
# OPENCLAW_HEARTBEAT_EVERY=off: an idle discord-friend heartbeat read a ~30k-token prompt (~50 s) every
# 30 min to answer "nothing to do", between a long run's calls. Exec-completion wakes still run.
# scripts/llm-ensure.sh starts the server after the gateway is healthy (compose/strata.yml).
services:
  vllm-llm:
    profiles: ["strata-off"]
  # The gateway waits for both vLLM services by default; !override replaces the whole map
  # (a profile alone makes compose refuse the project: "depends on undefined service").
  openclaw-gateway:
    depends_on: !override
      openclaw-config-init:
        condition: service_completed_successfully
      vllm-embedding:
        condition: service_healthy
