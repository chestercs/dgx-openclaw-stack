######################
## Mistral Small 4 backend — compose override for the `vllm-llm` service
#
#  Swaps the default Gemma 4 MoE for mistralai/Mistral-Small-4-119B-2603-NVFP4
#  while keeping the service name, hostname and port (vllm-llm:8004), so the
#  gateway, its depends_on chain and the Fish TTS boot-order guard need no
#  changes. Enable it in .env:
#
#    COMPOSE_FILE=docker-compose.yml:docker-compose.mistral.yml
#    LLM_MODEL_ID=mistralai/Mistral-Small-4-119B-2603-NVFP4
#
#  LLM_MODEL_ID must be set in .env (not only defaulted here): the config
#  patcher reads it to register the model under the same id vLLM serves and to
#  move the default / image / utility model references over to it.
#  Rollback: drop the file from COMPOSE_FILE, unset LLM_MODEL_ID, then
#  `docker compose up -d --force-recreate vllm-llm openclaw-config-init
#  openclaw-gateway openclaw-cli`.
#
#  Model: 119B total / ~6.5B active per token (128 experts, 4 active), MLA
#  attention, 256K context, text + image input, Apache 2.0. The NVFP4 weights
#  take ~66 GiB, so this does NOT fit next to ComfyUI's video workflows; image
#  generation still fits (see LLM_MISTRAL_GPU_MEM_UTIL below).
#
#  Measured on GB10, vLLM v0.31.0 (2026-10-18):
#    - Decode ~29.6 tok/s single stream; 4 parallel streams ~75 tok/s total
#      (~19 tok/s each).
#    - Prefill ~1900 tok/s (99k-token prompt in 52 s).
#    - Weight load ~450 s from the USB SSD, ~9.5 min to healthy in total.
#
#  Key flags:
#    --tokenizer-mode/--config-format/--load-format mistral : the NVFP4 repo
#        ships only Mistral-format files (params.json + consolidated-*), no
#        HF config.json.
#    --attention-backend TRITON_MLA : the FlashAttention / FlashInfer MLA
#        decode kernels are built for sm100 and crash on GB10 (sm121) with
#        cudaErrorIllegalInstruction. TRITON_MLA works; prefill still uses
#        FLASH_ATTN.
#    --reasoning-parser mistral : thinking is switched per request by
#        `reasoning_effort` ("none" | "high"). OpenClaw only sends that field
#        when the catalog entry has compat.supportsReasoningEffort, which the
#        patcher writes for Mistral ids. Without it every turn runs with no
#        thinking at all (measured: 8/12 vs 11/12 on the repo eval set).
#    No --kv-cache-dtype fp8: MLA already compresses KV to ~23 KB/token.
#    No speculative decoding: the Mistral-Small-4-119B-2603-eagle draft does
#        not load on v0.31.0 / v0.32.0 (missing attribute in
#        EagleMistralLarge3Model, then "is not a multimodal model"), and the
#        published GB10 EAGLE run reached the same ~29.5 tok/s anyway.
######################
services:
  vllm-llm:
    build: !reset null
    image: ${LLM_MISTRAL_IMAGE:-vllm/vllm-openai:v0.31.0}
    command: >
      --model ${LLM_MODEL_ID:?set LLM_MODEL_ID=mistralai/Mistral-Small-4-119B-2603-NVFP4 in .env}
      --tokenizer-mode mistral
      --config-format mistral
      --load-format mistral
      --host 0.0.0.0
      --port 8004
      --api-key ${VLLM_API_KEY:-}
      --gpu-memory-utilization ${LLM_MISTRAL_GPU_MEM_UTIL:-0.65}
      --max-model-len ${LLM_MISTRAL_MAX_MODEL_LEN:-131072}
      --max-num-seqs ${LLM_MISTRAL_MAX_NUM_SEQS:-4}
      --max-num-batched-tokens 8192
      --attention-backend TRITON_MLA
      --tool-call-parser mistral
      --enable-auto-tool-choice
      --reasoning-parser mistral
      --limit-mm-per-prompt '{"image":${LLM_LIMIT_MM_IMAGES:-4}}'
      --enable-prefix-caching
      --enable-chunked-prefill
    healthcheck:
      # ~450 s weight load + compile + FlashInfer autotune before /health is
      # up. The base 180 s start_period would mark the container unhealthy
      # and fail the gateway's depends_on during a normal cold start.
      start_period: 900s
