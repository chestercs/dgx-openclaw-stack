# SearxNG override settings — merged on top of the upstream defaults.
# Default settings reference:
#   https://github.com/searxng/searxng/blob/master/searx/settings.yml
# Admin docs:
#   https://docs.searxng.org/admin/settings/index.html
#
# Only the deltas OpenClaw's `web_search` provider needs
# (https://docs.openclaw.ai/tools/searxng-search):
#
#   1. JSON API on (search.formats): OpenClaw calls /search?...&format=json.
#   2. A measured engine set (keep_only below), picked for result quality in
#      Hungarian and English. Google, Bing, Yandex and Baidu are not listed,
#      so queries never reach them directly. Yahoo is listed (it serves Bing's
#      index) because it was the best engine measured.
#   3. Rate limiter off (internal-only service on the compose bridge).
#   4. Safe search off.
#
# Engine health is what silently rots here. Scraped engines start answering
# CAPTCHA / 429 / 403 to a home or datacenter IP, and no error reaches the
# agent: SearxNG just returns fewer results, and the agent gets confident
# off-topic junk. Check `unresponsive_engines` in the JSON response:
#   docker exec openclaw-cli curl -sS \
#     "http://searxng:8080/search?q=test&format=json" | jq .unresponsive_engines
# and a single engine with `&engines=<name>`.
#
# Measured on the reference host (2026-10-20, Hungarian residential IP,
# SearxNG 2026.10): 20 fact questions, 10 Hungarian and 10 English; a hit
# means the answer is in the top 5 results. Per engine, hu / en:
#   yahoo           10/10  10/10
#   duckduckgo web   9/10   9/10   (the plain "duckduckgo" engine: CAPTCHA)
#   privacywall      9/10   8/10
#   marginalia       8/10   9/10
#   yep              4/10  10/10   (mostly ignores Hungarian)
#   seznam 4+5, mwmbl 1+4 (timeouts), bing 1+0, google / brave / qwant 0
#   (blocked or rate-limited), most small engines 0.
# News engines on "Magyarország kormány" / "Hungary government": duckduckgo
# news (20 results dated today), bing news (10, Hungarian too), yahoo news
# (English only); google news, qwant news (access denied), reuters (HTTP
# error), brave.news (crash) return nothing. Adding them to every search
# ("general,news") scored 35/40 against 34/40 for "general" alone.
# The previous set (yep, mwmbl, duckduckgo, brave) scored 4/10 + 9/10 through
# the gateway, with Polish and Czech Wikipedia pages on Hungarian questions.
# This set scores 9-10/10 on both, with hu.wikipedia.org on top for
# Hungarian. Re-measure before you change the list.

use_default_settings:
  engines:
    # Only the listed engines stay in the registry; every other upstream
    # engine is discarded.
    keep_only:
      # General web (measurements above)
      - yahoo
      - duckduckgo web
      - privacywall
      - marginalia
      - yep
      # News (dated articles; the gateway asks for "general,news")
      - bing news
      - duckduckgo news
      - yahoo news
      # Public knowledge
      - wikipedia
      # Queried only when a search asks for their category (it / science),
      # never on a default "general" search.
      - github
      - arxiv
      # Deliberately NOT listed:
      # - wikibooks / wikiquote / wikisource: full-text search over books and
      #   quote collections, filed under `general`. When the web engines were
      #   blocked they were the only survivors and answered "mi az a wow
      #   forever" with Mirad grammar pages and a court indictment.
      # - wikidata: infobox-only (the OpenClaw plugin reads `results`, never
      #   `infoboxes`), and its SPARQL backend times out at the 3 s default.

general:
  debug: false
  instance_name: "dgx-openclaw-search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  # Substituted from the SEARXNG_SECRET env var by the image entrypoint; the
  # compose file also exports SEARXNG_SECRET for older images.
  secret_key: "${SEARXNG_SECRET}"
  limiter: false                # internal-only service; no public abuse surface
  public_instance: false
  image_proxy: false            # JSON API consumer doesn't need image proxying

ui:
  static_use_hash: true
  default_locale: ""

search:
  safe_search: 0
  autocomplete: ""
  # "auto" = detect the language from the query whenever the caller sends
  # none (an explicit per-query language still wins).
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json                      # required by OpenClaw; off by default upstream

# `keep_only` only filters the registry; engines that upstream ships with
# `disabled: true` still need an explicit `disabled: false` to run.
engines:
  - name: yahoo
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: privacywall
    disabled: false
  - name: marginalia
    disabled: false
  - name: yep
    disabled: false
  - name: bing news
    disabled: false
  - name: duckduckgo news
    disabled: false
  # Upstream marks it inactive; it answered English news queries on 2026-10-20.
  - name: yahoo news
    disabled: false
    inactive: false
  # Upstream ships Wikipedia as infobox-only. The OpenClaw plugin ignores
  # infoboxes, so without "list" an exact article hit never reaches the agent.
  - name: wikipedia
    display_type: ["infobox", "list"]
