# dgx-openclaw-stack: a self-hosted OpenClaw agent on one NVIDIA GB10
# (DGX Spark / ASUS Ascent GX10).
#
#   vllm-llm             the chat model (Nemotron 3.5 Super NVFP4), port 8004
#   vllm-embedding       bge-m3 embeddings for memory search
#   searxng              web search backend
#   openclaw-stt-whisper speech-to-text for voice notes
#   openclaw-config-init writes openclaw.json from .env, then exits
#   openclaw-gateway     OpenClaw: Web UI, Discord, agents (port 18789)
#   openclaw-cli         `docker exec openclaw-cli openclaw ...`
#   profiles: browser (Chromium over CDP), python (code sandbox),
#             meshcore (LoRa mesh bridge)
#
# Optional extras live in compose/ (TTS, the image bot, other models); add
# them through COMPOSE_FILE in .env. Every knob is documented in
# .env.example; the design notes are in docs/.

# The project name fixes the network name (<name>_default) that the separate
# ComfyUI bridge compose (openclaw-image-comfyui/) joins.
name: ${COMPOSE_PROJECT_NAME:-dgx-openclaw}

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

# Shared by every vLLM service. The GB10 has one unified memory pool, so the
# GPU share of each server is set per service (--gpu-memory-utilization).
x-vllm: &vllm
  restart: unless-stopped
  ipc: host
  environment:
    HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  volumes:
    - hf-cache:/root/.cache/huggingface
  deploy: *gpu
  ulimits:
    memlock: -1
    stack: 67108864
  logging: *logging

# The three OpenClaw containers run the same image on the same state.
x-openclaw: &openclaw
  image: openclaw-base-ext:${OPENCLAW_BASE_EXT_VERSION:-local}
  volumes:
    - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
    - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    # The python sandbox works in this folder too, so code the agent writes
    # there is visible to both.
    - ${OPENCLAW_SANDBOX_DIR:-${OPENCLAW_WORKSPACE_DIR}/sandbox}:/home/node/.openclaw/workspace/sandbox
    # Generated and downloaded media the agent attaches to replies. Kept out
    # of the config dir so it does not sit next to tokens and survives a
    # change of OPENCLAW_CONFIG_DIR.
    - ${OPENCLAW_CANVAS_DIR:-${OPENCLAW_CONFIG_DIR}/canvas}:/home/node/.openclaw/canvas
    - ${OPENCLAW_MEDIA_INBOUND_DIR:-${OPENCLAW_CONFIG_DIR}/media/inbound}:/home/node/.openclaw/media/inbound
  logging: *logging

volumes:
  # Model weights. Bound to a host dir so they survive `down -v` and can be
  # shared with a sibling stack.
  hf-cache:
    name: ${VLLM_HF_CACHE_VOLUME_NAME:-dgx-openclaw-hf-cache}
    driver: local
    driver_opts:
      type: none
      device: ${VLLM_HF_CACHE_DIR}
      o: bind
  stt-whisper-hf-cache:
    name: dgx-openclaw-stt-whisper-hf-cache
  browser-storage:
    name: dgx-openclaw-browser-storage
  browser-diagnostics:
    name: dgx-openclaw-browser-diagnostics

services:
  # Nemotron 3.5 Super 120B-A12B NVFP4 (vision + tools + reasoning). Needs
  # ~70 GiB of the 128 GB pool at the default share and the GB10 clock cap
  # (scripts/gb10-clock-cap.service): under sustained load an uncapped box
  # powers itself off. Other models: compose/gemma4.yml, compose/mistral.yml.
  vllm-llm:
    <<: *vllm
    image: ${LLM_IMAGE:-vllm/vllm-openai:v0.32.0}
    container_name: ${CONTAINER_NAME_PREFIX:-}vllm-llm
    hostname: vllm-llm
    ports:
      - "${LLM_BIND:-127.0.0.1}:8004:8004"
    command: >
      --model ${LLM_MODEL_ID:-nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4}
      --served-model-name ${LLM_MODEL_ID:-nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4}
      --trust-remote-code
      --host 0.0.0.0
      --port 8004
      --api-key ${VLLM_API_KEY:-}
      --gpu-memory-utilization ${LLM_GPU_MEM_UTIL:-0.70}
      --max-model-len ${LLM_MAX_MODEL_LEN:-131072}
      --max-num-seqs ${LLM_MAX_NUM_SEQS:-4}
      --max-num-batched-tokens 8192
      --speculative-config.model ${LLM_DRAFT_MODEL:-nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr}
      --speculative-config.num-speculative-tokens ${LLM_SPEC_TOKENS:-7}
      --speculative-config.method dflash
      --mamba-backend flashinfer
      --mamba-ssm-cache-dtype float16
      --enable-mamba-cache-stochastic-rounding
      --mamba-cache-philox-rounds 5
      --enable-mamba-shared-prefix-checkpoint
      --block-size 64
      --prefix-match-unit 64
      --limit-mm-per-prompt '{"image":${LLM_LIMIT_MM_IMAGES:-4},"video":0}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser nemotron_v3
      --default-chat-template-kwargs '{"medium_effort": true}'
    # medium_effort: full thinking ran 57k-token turns; thinking off looped on
    # tool-call JSON.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8004/health\", timeout=2)'"]
      interval: 15s
      timeout: 5s
      retries: 20
      # First start downloads ~80 GB and compiles kernels.
      start_period: 1500s

  vllm-embedding:
    <<: *vllm
    image: ${EMBED_IMAGE:-vllm/vllm-openai:gemma4-cu130}
    container_name: ${CONTAINER_NAME_PREFIX:-}vllm-embedding
    hostname: vllm-embedding
    command: >
      BAAI/bge-m3
      --served-model-name BAAI/bge-m3
      --runner pooling
      --host 0.0.0.0
      --port 8005
      --api-key ${VLLM_API_KEY:-}
      --gpu-memory-utilization ${EMBED_GPU_MEM_UTIL:-0.03}
      --max-model-len ${EMBED_MAX_MODEL_LEN:-8192}
      --max-num-seqs ${EMBED_MAX_NUM_SEQS:-2}
      --enforce-eager
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8005/health\", timeout=2)'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # Engines and why they were picked: searxng/settings/settings.yml.
  # Scraped engines break as search sites change, so the image is re-pulled
  # weekly rather than pinned.
  searxng:
    image: searxng/searxng:latest
    pull_policy: ${SEARXNG_PULL_POLICY:-weekly}
    container_name: ${CONTAINER_NAME_PREFIX:-}searxng
    hostname: searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./searxng/settings:/etc/searxng:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    logging: *logging

  # faster-whisper large-v3-turbo; Hungarian and English are detected per
  # request. Wired into OpenClaw as the audio model for voice notes.
  openclaw-stt-whisper:
    build: ./openclaw-stt-whisper/server
    image: openclaw-stt-whisper:0.1.0
    container_name: ${CONTAINER_NAME_PREFIX:-}openclaw-stt-whisper
    hostname: openclaw-stt-whisper
    restart: unless-stopped
    ports:
      - "${STT_WHISPER_BIND:-127.0.0.1}:${STT_WHISPER_PORT:-8093}:8080"
    environment:
      STT_API_TOKEN: ${STT_API_TOKEN:-}
      WHISPER_MODEL: ${STT_WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      WHISPER_COMPUTE_TYPE: ${STT_WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - stt-whisper-hf-cache:/root/.cache/huggingface
    deploy: *gpu
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  # Writes openclaw.json and the agent workspaces from .env (config-init/),
  # then exits. Before onboarding there is no openclaw.json and it exits 0;
  # see SETUP.md for the two-phase first start.
  openclaw-config-init:
    <<: *openclaw
    build:
      context: ./openclaw-base-ext
      args:
        OPENCLAW_BASE: ghcr.io/openclaw/openclaw${OPENCLAW_IMAGE_REF:-:latest}
    container_name: ${CONTAINER_NAME_PREFIX:-}openclaw-config-init
    user: "1000:1000"
    restart: "no"
    env_file:
      - path: .env
        required: false
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - ${OPENCLAW_CANVAS_DIR:-${OPENCLAW_CONFIG_DIR}/canvas}:/home/node/.openclaw/canvas
      - ./config-init:/opt/config-init:ro
    entrypoint: ["node", "/opt/config-init/patch-config.mjs"]

  openclaw-gateway:
    <<: *openclaw
    container_name: ${CONTAINER_NAME_PREFIX:-}openclaw-gateway
    restart: unless-stopped
    init: true
    # npm (plugin installs) hits EAI_AGAIN on Docker's embedded resolver;
    # the cli and meshcore containers share this network namespace.
    dns: [8.8.8.8, 1.1.1.1]
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    environment:
      HOME: /home/node
      TZ: ${TZ:-UTC}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      # openclaw.json refers to these by name (env SecretRefs, config-init/
      # lib/secrets.mjs) instead of holding the values.
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OPENCLAW_TTS_FISH_API_KEY: ${OPENCLAW_TTS_FISH_API_KEY:-}
      NODE_COMPILE_CACHE: /home/node/.openclaw/.node-compile-cache
      # The container restarts on its own (restart: unless-stopped); a second
      # in-process respawn would race it.
      OPENCLAW_NO_RESPAWN: "1"
    command: ["node", "dist/index.js", "gateway", "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}", "--port", "18789"]
    depends_on:
      openclaw-config-init:
        condition: service_completed_successfully
      vllm-llm:
        condition: service_healthy
      vllm-embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Shares the gateway's network namespace, so `openclaw` here talks to the
  # gateway on loopback. Recreate it whenever the gateway is recreated;
  # scripts/netns-dependents-up.sh --watch does that automatically.
  openclaw-cli:
    <<: *openclaw
    container_name: ${CONTAINER_NAME_PREFIX:-}openclaw-cli
    network_mode: "service:openclaw-gateway"
    pid: "service:openclaw-gateway"
    init: true
    stdin_open: true
    tty: true
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOME: /home/node
      TZ: ${TZ:-UTC}
      BROWSER: echo
      NODE_COMPILE_CACHE: /home/node/.openclaw/.node-compile-cache
      OPENCLAW_NO_RESPAWN: "1"
      # Read by `openclaw channels add --channel discord` during setup.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    command: ["sleep", "infinity"]
    depends_on:
      - openclaw-gateway

  # Chromium with persistent, named login profiles, driven over CDP.
  # Log a profile in once with ./bootstrap-browser-login.sh <profile>
  # (password + TOTP; passkeys do not work over noVNC).
  # Details: docs/reference/browser-automation.md
  openclaw-browser:
    profiles: ["browser"]
    build: ./openclaw-browser/server
    image: openclaw-browser:0.1.0
    container_name: ${CONTAINER_NAME_PREFIX:-}openclaw-browser
    hostname: openclaw-browser
    restart: unless-stopped
    init: true
    ports:
      - "${BROWSER_BIND:-127.0.0.1}:${BROWSER_API_PORT:-9220}:9220"
      - "${BROWSER_BIND:-127.0.0.1}:9222-9241:9222-9241"
      - "${BROWSER_VNC_BIND:-127.0.0.1}:${BROWSER_VNC_PORT:-5901}:5901"
    environment:
      BROWSER_API_TOKEN: ${BROWSER_API_TOKEN:-}
      BROWSER_VNC_PASSWORD: ${BROWSER_VNC_PASSWORD:-}
      BROWSER_PROFILE_NAMES: ${BROWSER_PROFILE_NAMES:-}
      BROWSER_DEFAULT_TIMEOUT_MS: ${BROWSER_DEFAULT_TIMEOUT_MS:-60000}
      BROWSER_STORAGE_DIR: /storage
    volumes:
      - browser-storage:/storage
      - browser-diagnostics:/diagnostics
      - ./openclaw-browser/config:/config:ro
    tmpfs: ["/tmp:rw,size=512m"]
    shm_size: "1gb"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9220/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  # Python over MCP with one persistent kernel per session, plus yt-dlp,
  # ffmpeg and a token-isolated transcription tool.
  # Details: docs/reference/python-sandbox.md
  openclaw-python-sandbox:
    profiles: ["python"]
    build: ./openclaw-python-sandbox/server
    image: openclaw-python-sandbox:0.1.0
    container_name: ${CONTAINER_NAME_PREFIX:-}openclaw-python-sandbox
    hostname: openclaw-python-sandbox
    user: "1000:1000"
    restart: unless-stopped
    init: true
    ports:
      - "${PYTHON_SANDBOX_BIND:-127.0.0.1}:${PYTHON_SANDBOX_PORT:-8094}:8094"
      # Static preview server for web projects the agent builds.
      - "${SANDBOX_PREVIEW_BIND:-0.0.0.0}:${SANDBOX_PREVIEW_PORT:-8095}:8095"
    environment:
      PYTHON_SANDBOX_API_TOKEN: ${PYTHON_SANDBOX_API_TOKEN:-}
      PYTHON_SANDBOX_KERNEL_TIMEOUT_S: ${PYTHON_SANDBOX_KERNEL_TIMEOUT_S:-30}
      STT_BASE_URL: http://openclaw-stt-whisper:8080/v1
      STT_API_TOKEN: ${STT_API_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-openclaw-bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-openclaw-bot@localhost}
    volumes:
      - ${OPENCLAW_SANDBOX_DIR:-${OPENCLAW_WORKSPACE_DIR}/sandbox}:/workspace:rw
      - ${OPENCLAW_CANVAS_DIR:-${OPENCLAW_CONFIG_DIR}/canvas}:/home/node/.openclaw/canvas:rw
    mem_limit: ${PYTHON_SANDBOX_MEMORY_MB:-8192}m
    cpus: ${PYTHON_SANDBOX_CPUS:-4}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8094/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # LoRa mesh access to the agent through a USB MeshCore companion radio.
  # Runs in the gateway's network namespace to reach its WebSocket on
  # loopback. Details: docs/reference/meshcore-bridge.md
  openclaw-meshcore-bridge:
    profiles: ["meshcore"]
    build: ./openclaw-meshcore-bridge
    image: openclaw-meshcore-bridge:${MESHCORE_BRIDGE_VERSION:-0.1.1}
    container_name: ${CONTAINER_NAME_PREFIX:-}openclaw-meshcore-bridge
    network_mode: "service:openclaw-gateway"
    restart: unless-stopped
    user: "1000:1000"
    group_add: [dialout]
    devices:
      - source: ${MESHCORE_SERIAL_DEVICE:-/dev/ttyACM0}
        target: /dev/meshcore
        permissions: rwm
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      MESHCORE_GATEWAY_WS_URL: ${MESHCORE_GATEWAY_WS_URL:-ws://127.0.0.1:18789}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/openclaw-config:ro
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    logging: *logging
