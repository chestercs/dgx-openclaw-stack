######################
## Nemotron 3.5 Super backend — compose override for the `vllm-llm` service
#
#  Swaps the default Gemma 4 MoE for
#  nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4 under the same
#  service name, hostname and port (vllm-llm:8004). Enable it in .env:
#
#    COMPOSE_FILE=docker-compose.yml:docker-compose.nemotron.yml
#    LLM_MODEL_ID=nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
#
#  LLM_MODEL_ID must be set in .env: the patcher registers the catalog entry
#  under the id vLLM serves and writes compat.thinkingFormat
#  "qwen-chat-template" for Nemotron ids (chat_template_kwargs.enable_thinking).
#  Rollback: drop the file from COMPOSE_FILE, unset LLM_MODEL_ID, then
#  `docker compose up -d --force-recreate vllm-llm openclaw-config-init
#  openclaw-gateway openclaw-cli`, and delete agents/*/agent/models.json.
#
#  Model: 120B hybrid Mamba/attention MoE, ~12B active per token, text +
#  image input. The NVFP4 weights take ~70 GiB, so ComfyUI does NOT fit
#  beside it at the default memory fraction.
#
#  Measured on an ASUS GX10 (GB10), vLLM v0.32.0, GPU clock capped at
#  2200 MHz (2026-10-19):
#    - Decode 19.8 tok/s single stream, 4 streams 43 tok/s total (Hungarian
#      text; the DFlash draft's acceptance varies with the text).
#    - Prefill 2588 tok/s (99k-token prompt in 38 s).
#    - Weight load ~6.5 min from a cold cache, ~10-22 min to healthy.
#    - Discord-agent eval: IQ 9/10, web 5/5, honesty traps 8/8. It is the
#      most factual of Mistral Small 4 / Qwen3.5-122B / Nemotron on this
#      stack, but its Hungarian is the weakest (stray English/German words).
#  Sustained prefill heats the GB10 enough for a hard power-off; run it with
#  scripts/gb10-clock-cap.service (docs/reference/gb10-power-thermal.md).
#
#  Key flags:
#    --default-chat-template-kwargs '{"medium_effort": true}' : with full
#        thinking a turn wrote 57k reasoning tokens and hit the 40-minute
#        timeout; with thinking off it looped on malformed tool-call JSON.
#        Medium effort is the setting that held up (agent tool loops, the
#        Valheim builder). Per-request enable_thinking still comes from
#        OpenClaw's compat.
#    --speculative-config.* dflash + the LiLiCorr draft : ~2.3 tokens
#        accepted per step on Hungarian text.
#    --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3.
#    --block-size 64 --prefix-match-unit 64 + the mamba flags: the hybrid
#        model's prefix cache works on 64-token blocks; these keep the
#        ~40k-token OpenClaw system prompt shared between sessions.
######################
services:
  vllm-llm:
    build: !reset null
    image: ${LLM_NEMOTRON_IMAGE:-vllm/vllm-openai:v0.32.0}
    command: >
      --model ${LLM_MODEL_ID:?set LLM_MODEL_ID=nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4 in .env}
      --served-model-name ${LLM_MODEL_ID} ${LLM_SERVED_MODEL_ALIASES:-}
      --trust-remote-code
      --host 0.0.0.0
      --port 8004
      --api-key ${VLLM_API_KEY:-}
      --gpu-memory-utilization ${LLM_NEMOTRON_GPU_MEM_UTIL:-0.70}
      --max-model-len ${LLM_NEMOTRON_MAX_MODEL_LEN:-131072}
      --max-num-seqs ${LLM_NEMOTRON_MAX_NUM_SEQS:-4}
      --max-num-batched-tokens 8192
      --speculative-config.model ${LLM_NEMOTRON_DRAFT_MODEL:-nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr}
      --speculative-config.num-speculative-tokens ${LLM_NEMOTRON_SPEC_TOKENS:-7}
      --speculative-config.method dflash
      --mamba-backend flashinfer
      --mamba-ssm-cache-dtype float16
      --enable-mamba-cache-stochastic-rounding
      --mamba-cache-philox-rounds 5
      --enable-mamba-shared-prefix-checkpoint
      --block-size 64
      --prefix-match-unit 64
      --limit-mm-per-prompt '{"image":${LLM_LIMIT_MM_IMAGES:-4},"video":0}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser nemotron_v3
      --default-chat-template-kwargs '{"medium_effort": true}'
    healthcheck:
      # Weight load, mamba-cache setup and FlashInfer autotune take 10-22 min
      # from a cold page cache. The base 180 s start_period would mark the
      # container unhealthy and fail the gateway's depends_on on a cold start.
      start_period: 1500s
